apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ship-it
  namespace: ship-it
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ship-it
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
